[tool.poetry]
name = "luxury_law_document_engine"
version = "1.0.0"
description = "Python FastAPI backend for document processing and export"
authors = ["Luxury Law Firm"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-docx = "^0.8.11"
pandoc = "^2.3"
pypandoc = "^1.11"
python-multipart = "^0.0.6"
fitz = "^0.0.1"  # PyMuPDF fallback

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
mypy = "^1.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
