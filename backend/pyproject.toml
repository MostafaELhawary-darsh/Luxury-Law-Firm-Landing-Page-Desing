[tool.poetry]
name = "luxury_law_backend"
version = "0.1.0"
description = "FastAPI backend for Luxury Law Firm project"
authors = ["Luxury Law Firm <admin@luxurylaw.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pydantic[email] = "^2.5.0"
sqlalchemy = "^2.1.0"
asyncpg = "^0.27.0"
alembic = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.8.0"}
celery = "^5.3.0"
redis = "^5.0.0"
python-multipart = "^0.0.6"
cors = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.10.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
mypy = "^1.6.0"
pytest-cov = "^4.1.0"
sqlite = "^3.44.0"
aiosqlite = "^0.19.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
