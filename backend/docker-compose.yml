version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: luxury_law
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/luxury_law
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-secure-random-value
    ports:
      - "8000:8000"
    volumes:
      - ./:/usr/src/app

volumes:
  db_data:
